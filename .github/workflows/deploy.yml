name: Deploy nach Azure

# Automatischer Rollout: jeder Push auf main baut das Image in der ACR und
# aktualisiert die Container App. Env-Variablen/Secrets der App werden dabei
# NICHT angefasst - die bleiben, wie infra/deploy.sh sie gesetzt hat.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # fuer OIDC-Login bei Azure (kein Passwort noetig)
  contents: read

# Zwei schnell aufeinanderfolgende Pushes starteten bisher zwei Deploys, die sich
# gegenseitig ins Gehege kamen (beide bauen und rollen dieselbe Container-App aus)
# - einer davon schlug fehl. Jetzt laeuft immer nur ein Deploy: ein neuer Push
# bricht den noch laufenden ab, denn nur der neueste Stand soll live gehen.
concurrency:
  group: deploy-azure
  cancel-in-progress: true

env:
  RG: lebenswerk-rg
  APP: lebenswerk-web
  ACR: lebenswerkacr0713
  ASSET_BASE: https://lebenswerkstore0713.blob.core.windows.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Image bauen (ACR)
        run: |
          az acr build -r "$ACR" -t "$ACR.azurecr.io/lebenswerk:${{ github.sha }}" \
            -f Dockerfile --build-arg VITE_PUBLIC_ASSET_BASE="$ASSET_BASE" . -o none

      - name: Web-App ausrollen
        run: |
          az containerapp update -g "$RG" -n "$APP" \
            --image "$ACR.azurecr.io/lebenswerk:${{ github.sha }}" -o none

      # Die Cron-Jobs laufen aus demselben Image - sonst driften sie vom Web-Stand ab.
      - name: Cron-Jobs auf dasselbe Image heben
        run: |
          for JOB in $(az containerapp job list -g "$RG" --query "[].name" -o tsv); do
            az containerapp job update -g "$RG" -n "$JOB" \
              --image "$ACR.azurecr.io/lebenswerk:${{ github.sha }}" -o none
            echo "aktualisiert: $JOB"
          done

      # Jeder Push legt ein Image ab. Ohne Aufraeumen lief die Registry voll: am
      # 23.09.2026 lagen dort 528 Images mit 33 GB, die SKU Basic erlaubt aber nur
      # 10 GB - jeder weitere Push scheiterte dann beim Hochladen ("Deploy: All
      # jobs have failed"), ohne dass am Code etwas falsch war. Deshalb bleiben
      # nur die KEEP neuesten stehen; aeltere Staende sind aus Git jederzeit neu
      # baubar. Ein Fehler hier darf den Deploy nicht rot faerben - er ist
      # laengst ausgerollt (|| true).
      - name: Alte Images aufraeumen (die neuesten 20 bleiben)
        run: |
          KEEP=20
          az acr repository show-tags -r "$ACR" --repository lebenswerk \
            --orderby time_desc -o tsv > tags.txt || exit 0
          tail -n +$((KEEP + 1)) tags.txt > alt.txt
          echo "Images gesamt: $(wc -l < tags.txt), zu loeschen: $(wc -l < alt.txt)"
          while read -r TAG; do
            [ -n "$TAG" ] || continue
            az acr repository delete -n "$ACR" --image "lebenswerk:$TAG" --yes -o none || true
          done < alt.txt
          az acr show-usage -n "$ACR" -o table || true
