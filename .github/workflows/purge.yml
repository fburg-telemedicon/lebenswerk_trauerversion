name: Tägliche DSGVO-Löschung (Retention)

# Ruft täglich den Purge-Endpunkt der Live-App auf. Dieser löscht vollständig
# alle Gedenkbücher, deren funeral_date (sonst created_at) + RETENTION_DAYS
# (Standard 90) in der Vergangenheit liegt – inkl. Storage-Bilder, cost_events
# und Beiträge.
#
# Voraussetzung: Repo-Secret CRON_SECRET (identisch zur Vercel-Env CRON_SECRET).
#   GitHub → Repo → Settings → Secrets and variables → Actions → New repository secret
#
# Hinweis: GitHub deaktiviert geplante Workflows nach 60 Tagen ohne Repo-Aktivität.

on:
  schedule:
    - cron: '0 3 * * *'   # täglich 03:00 UTC
  workflow_dispatch:        # manueller Start (zum Testen)
    inputs:
      dry:
        description: 'Nur anzeigen, nicht löschen (Dry-Run)'
        type: boolean
        default: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge-Endpunkt aufrufen
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repo-Secret CRON_SECRET fehlt."
            exit 1
          fi
          URL="https://lebensgeschichten.vercel.app/api/cron/purge"
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then URL="$URL?dry=1"; fi
          echo "Rufe $URL auf …"
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$URL")
          echo "HTTP $code"
          cat response.json; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Purge fehlgeschlagen (HTTP $code)"
            exit 1
          fi
