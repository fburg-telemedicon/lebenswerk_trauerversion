<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lebensgeschichten – Gemeinsames Gedenkbuch</title>
    <meta name="description" content="Familie, Freunde und Wegbegleiter erinnern sich gemeinsam und schaffen ein bleibendes Gedenkbuch." />
    <!-- PWA: Installierbar als App aufs Handy (Home-Bildschirm). Das Manifest wird
         je nach Produkt-Kontext per JS umgeschaltet (src/pwa.js): Standard =
         Lebensgeschichten.ai, im Lebenswerk-Flow = Lebenswerk.ai. -->
    <link rel="manifest" href="/manifest.webmanifest" id="pwa-manifest" />
    <meta name="theme-color" content="#c1272d" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lebensgeschichten" id="pwa-apple-title" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fafaf9;
        color: #1c1917;
        line-height: 1.5;
      }
      input, textarea, button, select {
        font-family: inherit;
        font-size: inherit;
      }
      /* Textfelder: volle Breite + Padding. Checkboxen/Radios AUSNEHMEN – sonst
         werden sie auf 100% Breite aufgeblasen und schieben Labels/Text weg. */
      input:not([type="checkbox"]):not([type="radio"]), textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        background: #fff;
        color: #1c1917;
        outline: none;
        transition: border-color .15s;
      }
      input:not([type="checkbox"]):not([type="radio"]):focus, textarea:focus { border-color: #78716c; }
      button {
        padding: 10px 20px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        background: #1c1917;
        color: #fafaf9;
        cursor: pointer;
        font-size: 14px;
        transition: opacity .15s;
      }
      button:hover:not(:disabled) { opacity: .85; }
      button:disabled { opacity: .4; cursor: not-allowed; }
      button.secondary {
        background: transparent;
        color: #1c1917;
        border: 1px solid #d6d3d1;
      }
      button.ghost {
        background: transparent;
        color: #78716c;
        border: none;
        padding: 6px 0;
      }
      textarea { resize: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service Worker registrieren (PWA-Installierbarkeit + schnellere Ladezeiten).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
