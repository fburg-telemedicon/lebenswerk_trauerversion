<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lebensgeschichten – Klickdummy</title>
<style>
/* ── Reset ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafaf9; color: #1c1917; }

/* ── Prototype Bar ──────────────────────────────────────────────────── */
#proto-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: 54px; background: #1c1917;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; gap: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.proto-logo { font-weight: 700; font-size: 14px; color: #fafaf9; white-space: nowrap; }
.proto-tabs { display: flex; gap: 6px; }
.proto-tab {
  padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.55);
  background: transparent; transition: all .15s; font-family: inherit;
}
.proto-tab.active { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.4); }
.proto-nav { display: flex; align-items: center; gap: 10px; }
.proto-nav-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
  color: #fff; cursor: pointer; font-size: 14px; font-family: inherit;
  display: flex; align-items: center; justify-content: center; transition: background .12s;
}
.proto-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.18); }
.proto-nav-btn:disabled { opacity: .25; cursor: not-allowed; }
.proto-label { font-size: 12px; color: rgba(255,255,255,0.45); min-width: 140px; text-align: center; }

/* ── Stage ──────────────────────────────────────────────────────────── */
#stage { margin-top: 54px; min-height: calc(100vh - 54px); }

/* ── iPhone Stage ───────────────────────────────────────────────────── */
.iphone-stage {
  min-height: calc(100vh - 54px);
  background: linear-gradient(160deg, #ede9e5 0%, #ddd6ce 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 32px 24px;
}

/* ── iPhone Frame ───────────────────────────────────────────────────── */
.iphone {
  width: 393px; height: 852px;
  background: #1d1d1f; border-radius: 55px; position: relative; flex-shrink: 0;
  box-shadow:
    0 0 0 1px #3a3a3c,
    0 0 0 3px #1d1d1f,
    0 0 0 5px #4a4a4c,
    0 50px 120px rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(255,255,255,.07);
}
.iphone::before { /* volume buttons */
  content: ''; position: absolute; left: -4px; top: 154px;
  width: 4px; height: 36px; background: #4a4a4c; border-radius: 2px 0 0 2px;
  box-shadow: 0 50px 0 #4a4a4c, 0 96px 0 #4a4a4c;
}
.iphone::after { /* power button */
  content: ''; position: absolute; right: -4px; top: 196px;
  width: 4px; height: 74px; background: #4a4a4c; border-radius: 0 2px 2px 0;
}
.iphone-screen {
  position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
  background: #fafaf9; border-radius: 46px; overflow: hidden;
}
.dynamic-island {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 20;
}
.status-bar {
  height: 56px; padding: 20px 26px 6px;
  display: flex; justify-content: space-between; align-items: flex-end;
  font-size: 12px; font-weight: 700; color: #1c1917; position: relative; z-index: 5;
}
.status-icons { display: flex; gap: 5px; align-items: center; font-size: 11px; }
.screen-scroll {
  height: 744px; overflow-y: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  position: relative;
}
.screen-scroll::-webkit-scrollbar { display: none; }
.home-indicator {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; background: #1c1917; border-radius: 3px; opacity: .22;
}

/* ── In-app Common Components ───────────────────────────────────────── */
.memorial-banner {
  background: #1c1917; color: #fafaf9; text-align: center; padding: 20px 20px 18px;
}
.memorial-banner .mem-name { font-size: 17px; font-weight: 700; }
.memorial-banner .mem-sub  { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 4px; }
.app-page { padding: 18px 20px 40px; }
.field-wrap { margin-bottom: 16px; }
.app-lbl { display: block; font-size: 11px; font-weight: 700; color: #78716c; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.app-input {
  width: 100%; padding: 10px 14px; border: 1px solid #d6d3d1; border-radius: 8px;
  background: #fff; font-size: 14px; color: #1c1917; font-family: inherit;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.sel-card {
  border: 1px solid #e7e5e4; border-radius: 10px; background: #fff;
  text-align: center; padding: 12px 8px; cursor: pointer;
}
.sel-card.on { border-color: #1c1917; border-width: 2px; }
.sel-card .card-title { font-size: 13px; font-weight: 600; }
.sel-card .card-sub   { font-size: 11px; color: #78716c; margin-top: 3px; }
.app-btn {
  width: 100%; padding: 13px; font-size: 14px; font-weight: 600;
  background: #1c1917; color: #fafaf9; border: none; border-radius: 10px; cursor: pointer;
  font-family: inherit; transition: opacity .12s;
}
.app-btn:hover { opacity: .87; }
.app-btn.ghost { background: #fff; color: #1c1917; border: 1px solid #d6d3d1; margin-top: 10px; }

/* ── Interview Chat ─────────────────────────────────────────────────── */
.chat-wrap  { padding: 14px 16px 6px; }
.chat-head  { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #e7e5e4; }
.chat-head-title { font-weight: 700; font-size: 14px; }
.chat-head-sub   { font-size: 11px; color: #78716c; }
.bubble     { margin-bottom: 12px; display: flex; flex-direction: column; }
.bubble.ai  { align-items: flex-start; }
.bubble.me  { align-items: flex-end; }
.bubble-name { font-size: 10px; color: #a8a29e; margin-bottom: 3px; padding: 0 4px; }
.bubble-text {
  max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 13px; line-height: 1.55;
}
.bubble.ai .bubble-text { background: #f3f2f1; color: #1c1917; border-bottom-left-radius: 4px; }
.bubble.me .bubble-text { background: #1c1917; color: #fafaf9; border-bottom-right-radius: 4px; }
.typing-dot { display: inline-flex; gap: 4px; padding: 12px 16px; background: #f3f2f1; border-radius: 18px; border-bottom-left-radius: 4px; }
.typing-dot span { width: 7px; height: 7px; background: #a8a29e; border-radius: 50%; animation: blink 1.4s infinite; }
.typing-dot span:nth-child(2) { animation-delay: .2s; }
.typing-dot span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }
.chat-input-row {
  position: sticky; bottom: 0; background: #fafaf9; border-top: 1px solid #e7e5e4;
  padding: 10px 14px; display: flex; gap: 8px; align-items: center;
}
.chat-text-input {
  flex: 1; padding: 9px 14px; border: 1px solid #d6d3d1; border-radius: 20px;
  font-size: 13px; color: #a8a29e; background: #fff; font-family: inherit;
}
.mic-btn {
  width: 38px; height: 38px; border-radius: 50%; background: #1c1917; border: none;
  color: #fff; font-size: 15px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.mic-live { background: #dc2626; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.5); } 50% { box-shadow: 0 0 0 8px rgba(220,38,38,0); } }

/* ── Video Screen ───────────────────────────────────────────────────── */
.video-screen {
  height: 744px; background: #000; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.video-play-icon { font-size: 72px; color: rgba(255,255,255,.75); margin-bottom: 28px; line-height: 1; }
.video-title { color: #fff; font-size: 19px; font-weight: 700; text-align: center; padding: 0 28px; }
.video-sub   { color: rgba(255,255,255,.45); font-size: 13px; margin-top: 10px; text-align: center; padding: 0 28px; line-height: 1.55; }
.video-progress {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.15);
}
.video-progress-fill { height: 100%; width: 38%; background: #fff; border-radius: 2px; }
.skip-btn {
  position: absolute; top: 16px; right: 16px;
  background: rgba(255,255,255,.13); color: #fff;
  border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
  padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.skip-btn:hover { background: rgba(255,255,255,.22); }

/* ── Done Screen ────────────────────────────────────────────────────── */
.done-screen { padding: 56px 24px 40px; text-align: center; }
.done-emoji  { font-size: 56px; margin-bottom: 20px; }
.done-title  { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
.done-body   { font-size: 14px; color: #78716c; line-height: 1.65; max-width: 280px; margin: 0 auto 28px; }
.done-info   {
  text-align: left; background: #f5f5f4; border-radius: 12px;
  padding: 14px 16px; font-size: 13px; color: #78716c; line-height: 1.7;
}
.done-info strong { color: #1c1917; }

/* ── Admin Stage ────────────────────────────────────────────────────── */
.admin-stage { min-height: calc(100vh - 54px); background: #fafaf9; }
.admin-topbar {
  background: #fff; border-bottom: 1px solid #e7e5e4;
  padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 54px; z-index: 10;
}
.admin-brand { font-weight: 700; font-size: 16px; }
.admin-logout {
  padding: 7px 14px; font-size: 13px; background: transparent;
  color: #1c1917; border: 1px solid #d6d3d1; border-radius: 8px; cursor: pointer; font-family: inherit;
}
.admin-body  { max-width: 960px; margin: 0 auto; padding: 28px 28px 60px; }

/* admin table */
.a-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #e7e5e4; }
.a-table th {
  text-align: left; padding: 12px 16px; font-size: 11px; font-weight: 700;
  color: #78716c; text-transform: uppercase; letter-spacing: .5px;
  background: #fafaf9; border-bottom: 1px solid #e7e5e4;
}
.a-table td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f5f5f4; vertical-align: middle; }
.a-table tr:last-child td { border-bottom: none; }
.a-table tr.clickable:hover td { background: #fef3c7; cursor: pointer; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge-green  { background: #dcfce7; color: #16a34a; }
.badge-yellow { background: #fef9c3; color: #ca8a04; }
.badge-gray   { background: #f3f4f6; color: #6b7280; }

.a-btn { padding: 6px 12px; border-radius: 7px; font-size: 13px; cursor: pointer; border: 1px solid #d6d3d1; background: #fff; color: #1c1917; font-family: inherit; }
.a-btn.dark { background: #1c1917; color: #fff; border-color: #1c1917; }
.a-btn:hover:not(.dark) { background: #fafaf9; }

/* admin detail */
.meta-box { background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.meta-title { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
.meta-sub { font-size: 14px; color: #78716c; line-height: 1.55; }
.contrib-card { background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.contrib-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.contrib-name { font-weight: 700; font-size: 15px; }
.contrib-rel  { font-size: 13px; color: #78716c; margin-left: 8px; }
.contrib-date { font-size: 12px; color: #a8a29e; }
.contrib-text { font-size: 13px; color: #44403c; line-height: 1.65; font-style: italic; }

/* admin login */
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 54px - 60px); padding: 40px 24px; }
.login-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e7e5e4; border-radius: 16px; padding: 36px; }
.login-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.login-sub   { font-size: 14px; color: #78716c; margin-bottom: 28px; }
.lf { margin-bottom: 16px; }
.lf label { display: block; font-size: 11px; font-weight: 700; color: #78716c; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.lf input { width: 100%; padding: 10px 14px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; }
.login-btn { width: 100%; padding: 13px; background: #1c1917; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 6px; }

/* create form */
.create-wrap { max-width: 540px; }
.cf { margin-bottom: 16px; }
.cf > label { display: block; font-size: 11px; font-weight: 700; color: #78716c; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }
.cf input[type=text], .cf input[type=date], .cf input[type=number] {
  width: 100%; padding: 10px 14px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: #1c1917;
}
.cf .hint { font-size: 12px; color: #78716c; margin-top: 6px; }
.variant-card { border: 1px solid #e7e5e4; border-radius: 10px; padding: 14px; cursor: pointer; margin-bottom: 8px; background: #fff; }
.variant-card.on { border-color: #1c1917; border-width: 2px; }
.variant-card .vt { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.variant-card .vs { font-size: 13px; color: #78716c; line-height: 1.5; }

/* animation */
.fade { animation: fadeUp .22s ease; }
@keyframes fadeUp { from { opacity:0; transform: translateY(5px); } to { opacity:1; transform: translateY(0); } }

/* ── Scrollbar globally ──────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }
</style>
</head>
<body>

<!-- ── PROTOTYPE BAR ─────────────────────────────────────────────────── -->
<div id="proto-bar">
  <div class="proto-logo">Lebensgeschichten — Klickdummy</div>
  <div class="proto-tabs">
    <button class="proto-tab active" id="tab-c" onclick="setMode('c')">📱 Contributor-Ansicht</button>
    <button class="proto-tab"        id="tab-a" onclick="setMode('a')">🖥 Admin-Bereich</button>
  </div>
  <div class="proto-nav">
    <button class="proto-nav-btn" id="btn-prev" onclick="move(-1)">←</button>
    <span class="proto-label" id="proto-label"></span>
    <button class="proto-nav-btn" id="btn-next" onclick="move(1)">→</button>
  </div>
</div>

<div id="stage"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────
const S = { mode: 'c', c: 0, a: 0 }

const C_LABELS = ['1/4 · Info-Formular', '2/4 · Einführungsvideo', '3/4 · Interview', '4/4 · Fertig']
const A_LABELS = ['1/4 · Login', '2/4 · Dashboard', '3/4 · Detailansicht', '4/4 · Neues Gedenkbuch']

function idx()    { return S.mode === 'c' ? S.c : S.a }
function maxIdx() { return S.mode === 'c' ? 3 : 3 }
function goTo(i)  { S[S.mode] = Math.max(0, Math.min(i, maxIdx())); render() }
function move(d)  { goTo(idx() + d) }

function setMode(m) {
  S.mode = m
  document.getElementById('tab-c').classList.toggle('active', m === 'c')
  document.getElementById('tab-a').classList.toggle('active', m === 'a')
  render()
}

function render() {
  const i   = idx()
  const lbl = (S.mode === 'c' ? C_LABELS : A_LABELS)[i]
  document.getElementById('proto-label').textContent = lbl
  document.getElementById('btn-prev').disabled = i === 0
  document.getElementById('btn-next').disabled = i === maxIdx()

  const stage = document.getElementById('stage')
  stage.innerHTML = S.mode === 'c' ? iphone(contribScreen()) : adminScreen()
}

// ── iPhone wrapper ─────────────────────────────────────────────────────
function iphone(inner) {
  return `
  <div class="iphone-stage">
    <div class="iphone">
      <div class="iphone-screen">
        <div class="dynamic-island"></div>
        <div class="status-bar">
          <span>9:41</span>
          <div class="status-icons">
            <span>▊▊▊▊</span><span style="font-size:9px;margin-left:1px">WiFi</span><span>🔋</span>
          </div>
        </div>
        <div class="screen-scroll">${inner}</div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>`
}

// ── Contributor Screens ────────────────────────────────────────────────
function contribScreen() {
  switch(S.c) {
    case 0: return screenInfo()
    case 1: return screenVideo()
    case 2: return screenInterview()
    case 3: return screenDone()
  }
}

function screenInfo() {
  return `
  <div class="fade">
    <div class="memorial-banner">
      <div class="mem-name">Im Gedenken an Elisabeth Hartmann</div>
      <div class="mem-sub">1942 – 2025 &nbsp;·&nbsp; Gedenkbuch von Klaus Hartmann</div>
    </div>
    <div class="app-page">
      <div class="field-wrap">
        <span class="app-lbl">Ihr Name *</span>
        <input class="app-input" value="Anna Bergmann" readonly>
      </div>
      <div class="field-wrap">
        <span class="app-lbl">Mein Geschlecht *</span>
        <div class="grid3" style="margin-top:4px">
          <div class="sel-card"><div class="card-title">Männlich</div></div>
          <div class="sel-card on"><div class="card-title">Weiblich</div></div>
          <div class="sel-card"><div class="card-title">Divers</div></div>
        </div>
      </div>
      <div class="field-wrap">
        <span class="app-lbl">Meine Beziehung zur Person *</span>
        <input class="app-input" value="Tochter" readonly>
      </div>
      <div class="field-wrap">
        <span class="app-lbl">Wie möchten Sie angesprochen werden? *</span>
        <div class="grid2" style="margin-top:4px">
          <div class="sel-card" style="padding:14px">
            <div class="card-title">Du</div>
            <div class="card-sub">Informell, vertraut</div>
          </div>
          <div class="sel-card on" style="padding:14px">
            <div class="card-title">Sie</div>
            <div class="card-sub">Förmlich, respektvoll</div>
          </div>
        </div>
      </div>
      <button class="app-btn" onclick="goTo(1)">🎙 Sprach-Interview beginnen →</button>
    </div>
  </div>`
}

function screenVideo() {
  return `
  <div class="video-screen fade">
    <button class="skip-btn" onclick="goTo(2)">Überspringen →</button>
    <div class="video-play-icon">▶</div>
    <div class="video-title">Willkommen bei Lebensgeschichten</div>
    <div class="video-sub">Dieses kurze Video erklärt, wie das Interview funktioniert und was Sie erwartet.</div>
    <div class="video-progress"><div class="video-progress-fill"></div></div>
  </div>`
}

function screenInterview() {
  return `
  <div class="fade">
    <div class="chat-head">
      <div class="chat-head-title">🎙 Interview</div>
      <div class="chat-head-sub">Anna Bergmann &nbsp;·&nbsp; Tochter</div>
    </div>
    <div class="chat-wrap">
      <div class="bubble ai">
        <div class="bubble-name">Lebensgeschichten</div>
        <div class="bubble-text">Herzlich willkommen, Anna. Ich freue mich, dass Sie sich die Zeit nehmen, Erinnerungen an Elisabeth zu teilen. Wie würden Sie Ihre Mutter in drei Worten beschreiben?</div>
      </div>
      <div class="bubble me">
        <div class="bubble-name">Sie</div>
        <div class="bubble-text">Warmherzig, geduldig und immer für uns da. Sie hatte diese besondere Gabe, jeden Menschen willkommen zu heißen.</div>
      </div>
      <div class="bubble ai">
        <div class="bubble-name">Lebensgeschichten</div>
        <div class="bubble-text">Das klingt wunderschön. Können Sie mir von einem Moment erzählen, der für Sie besonders prägend war – einem Erlebnis, das Ihre Mutter so einzigartig machte?</div>
      </div>
      <div class="bubble me">
        <div class="bubble-name">Sie</div>
        <div class="bubble-text">Jeden Sonntag hat sie für die ganze Familie gekocht. Der Geruch von ihrem Sonntagsbraten … der wird mir immer fehlen. Egal was in der Woche war, sonntags saßen wir alle zusammen.</div>
      </div>
      <div class="bubble ai">
        <div class="bubble-name">Lebensgeschichten</div>
        <div class="bubble-text">Diese Sonntage klingen wie ein echter Anker für die Familie. Gab es Werte oder Weisheiten, die Ihre Mutter Ihnen weitergegeben hat?</div>
      </div>
      <div class="bubble me">
        <div class="bubble-name">Sie</div>
        <div class="bubble-text">„Eine Hand wäscht die andere" – das hat sie oft gesagt und es wirklich gelebt. Für jeden, der Hilfe brauchte, hatte sie Zeit. Ohne zu klagen.</div>
      </div>
      <div class="bubble ai">
        <div class="bubble-name">Lebensgeschichten</div>
