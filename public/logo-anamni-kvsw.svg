<?xml version="1.0" encoding="UTF-8"?>
<!--
  Anamni.ai — Co-Brand für den Klinikverbund Südwest (KVSW).
  Der Ring greift die drei Farben des KVSW-Bildmotivs auf (Orange/Gelb/Grün);
  „.ai" steht in einer Klinikfarbe (Orange). „Anamni" im KVSW-Dunkelblau.
  Farben sind bewusst als klar benannte Konstanten gehalten — bei Vorliegen der
  offiziellen CD-Hexwerte hier einfach ersetzen:
    Orange  #EE7D11   Gelb  #F4B41A   Grün  #7DB928   Dunkelblau  #16324F
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 120" width="384" height="120" role="img" aria-label="Anamni.ai – Klinikverbund Südwest">
  <!-- Dreifarbiger Ring (KVSW-Bildmotiv: Orange/Gelb/Grün) -->
  <g fill="none" stroke-width="13" stroke-linecap="round">
    <path d="M 66.94 20.61 A 40 40 0 0 1 94.64 80.00" stroke="#EE7D11"/>
    <path d="M 90.64 85.71 A 40 40 0 0 1 25.36 80.00" stroke="#F4B41A"/>
    <path d="M 22.41 73.68 A 40 40 0 0 1 60.00 20.00" stroke="#7DB928"/>
  </g>
  <!-- Wortmarke -->
  <text x="126" y="77" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
    <tspan fill="#16324F">Anamni</tspan><tspan fill="#EE7D11">.ai</tspan>
  </text>
</svg>
