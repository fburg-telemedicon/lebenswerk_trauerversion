<?xml version="1.0" encoding="UTF-8"?>
<!--
  Anamni.ai — Co-Brand für den Klinikverbund Südwest (KVSW).
  Bildmarke = das KVSW-Dreiblatt-Motiv (drei Blätter im Kreis): Grün (oben links),
  Koralle (oben rechts), Gelb (unten). Farben aus dem offiziellen Logo entnommen.
  „Anamni" in Dunkel-Anthrazit, „.ai" in einer Klinikfarbe (Koralle).
    Grün #548A51   Koralle #EE7555   Gelb #FBE100
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="Anamni.ai – Klinikverbund Südwest">
  <!-- KVSW-Dreiblatt: EIN Blatt (nach oben) dreimal um den Mittelpunkt (60,60) gedreht -->
  <g>
    <path d="M60 4 C76 21 76 39 60 56 C44 39 44 21 60 4 Z" fill="#548A51" transform="rotate(-60 60 60)"/>
    <path d="M60 4 C76 21 76 39 60 56 C44 39 44 21 60 4 Z" fill="#EE7555" transform="rotate(60 60 60)"/>
    <path d="M60 4 C76 21 76 39 60 56 C44 39 44 21 60 4 Z" fill="#FBE100" transform="rotate(180 60 60)"/>
  </g>
  <!-- Wortmarke -->
  <text x="134" y="80" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">
    <tspan fill="#2A2A2A">Anamni</tspan><tspan fill="#EE7555">.ai</tspan>
  </text>
</svg>
