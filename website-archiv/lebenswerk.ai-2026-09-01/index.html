    <!-- Inline script to force opaque dropdowns after load -->
    <script>
      window.addEventListener('load', function() {
        function forceOpaqueDropdowns() {
          // Determine background color based on theme
          const isDark = document.documentElement.classList.contains('dark');
          const bgColor = isDark ? '#222222' : '#FFFFFF';
          
          // Target all potential dropdown elements
          const selectors = [
            '[data-radix-popper-content-wrapper]',
            '[data-radix-menu-content]',
            '[role="menu"]',
            '[role="menuitem"]',
            '[data-radix-dropdown-menu-content]'
          ];
          
          selectors.forEach(function(selector) {
            document.querySelectorAll(selector).forEach(function(el) {
              if (el instanceof HTMLElement) {
                el.style.setProperty('background-color', bgColor, 'important');
                el.style.setProperty('opacity', '1', 'important');
                el.style.setProperty('backdrop-filter', 'none', 'important');
                el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
              }
            });
          });
        }
        
        // Run immediately and multiple times with delays
        forceOpaqueDropdowns();
        setTimeout(forceOpaqueDropdowns, 100);
        setTimeout(forceOpaqueDropdowns, 500);
        
        // Set up event listeners for user interactions
        document.addEventListener('click', function() {
          setTimeout(forceOpaqueDropdowns, 10);
          setTimeout(forceOpaqueDropdowns, 100);
        });
        
        // Set up periodic checks
        setInterval(forceOpaqueDropdowns, 2000);
      });
    </script>
